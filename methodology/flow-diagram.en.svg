<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1435" viewBox="0 0 600 1435" role="img" aria-labelledby="title desc"><title id="title">CoolFlow Development Flow</title><desc id="desc">One development flow · Three feedback loops</desc><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif}.brand{font-size:27px;font-weight:750;fill:#173c31}.sub{font-size:17px;fill:#637970}.section{font-size:16px;font-weight:750;letter-spacing:.5px;fill:#46866f}.hint{font-size:14px;fill:#70837a}.number{font-size:15px;font-weight:750;fill:#4c9576}.stage{font-size:19px;font-weight:700;fill:#213e34}.desc{font-size:16px;fill:#61766c}.arrow{fill:none;stroke:#91afa0;stroke-width:1.5;marker-end:url(#tip)}.loopTitle{font-size:15px;font-weight:750}.nodeLabel{font-size:14px;font-weight:700;fill:#263e35}.loopSeq{font-size:18px;font-weight:700;fill:#263e35}.loopDesc{font-size:15px;fill:#62766b}.foot{font-size:15px;fill:#536c60}</style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#91afa0"/></marker><marker id="loop-tip-0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#548abf"/></marker><marker id="loop-tip-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#55a978"/></marker><marker id="loop-tip-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9673b6"/></marker></defs><rect width="600" height="1435" rx="15" fill="#f7f9f6"/><text x="28" y="50" class="brand">CoolFlow Development Flow</text><text x="28" y="77" class="sub">One development flow · Three feedback loops</text><path d="M28 101 H572" stroke="#dce6df"/><text x="28" y="136" class="section">DEVELOPMENT FLOW</text><g><rect x="28" y="176" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="206" class="number">01</text><text x="92" y="205" class="stage">Idea &amp; brainstorm</text><text x="92" y="228" class="desc">Define problem, users, competitors &amp; value</text></g><path d="M300 245 V257" class="arrow"/><g><rect x="28" y="259" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="289" class="number">02</text><text x="92" y="288" class="stage">Domain modeling</text><text x="92" y="311" class="desc">Align language and boundaries</text></g><path d="M300 328 V340" class="arrow"/><g><rect x="28" y="342" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="372" class="number">03</text><text x="92" y="371" class="stage">Concept prototype &amp; validation</text><text x="92" y="394" class="desc">Test critical assumptions</text></g><path d="M300 411 V423" class="arrow"/><g><rect x="28" y="425" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="455" class="number">04</text><text x="92" y="454" class="stage">Roadmap</text><text x="92" y="477" class="desc">Set release scope and direction</text></g><path d="M300 494 V506" class="arrow"/><g><rect x="28" y="508" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="538" class="number">05</text><text x="92" y="537" class="stage">UI prototype</text><text x="92" y="560" class="desc">Design the user experience</text></g><path d="M300 577 V589" class="arrow"/><g><rect x="28" y="591" width="544" height="69" rx="9" fill="#f1f7fe" stroke="#accbe7"/><text x="48" y="621" class="number">06</text><text x="92" y="620" class="stage">Design spec</text><text x="92" y="643" class="desc">Define requirements and acceptance</text></g><path d="M300 660 V672" class="arrow"/><g><rect x="28" y="674" width="544" height="69" rx="9" fill="#eff9f3" stroke="#a8d7ba"/><text x="48" y="704" class="number">07</text><text x="92" y="703" class="stage">Implementation</text><text x="92" y="726" class="desc">Code, test, review, and fix</text></g><path d="M300 743 V755" class="arrow"/><g><rect x="28" y="757" width="544" height="69" rx="9" fill="#fff" stroke="#dbe6dd"/><text x="48" y="787" class="number">08</text><text x="92" y="786" class="stage">Human acceptance &amp; delivery</text><text x="92" y="809" class="desc">Accept → sync docs → release</text></g><text x="28" y="884" class="section">THREE FEEDBACK LOOPS</text><g><rect x="28" y="907" width="544" height="156" rx="9" fill="#f1f7fe"/><rect x="28" y="907" width="4" height="156" rx="2" fill="#548abf"/><text x="46" y="932" class="loopTitle" fill="#548abf">01 · DESIGN SPEC LOOP</text><rect x="46" y="946" width="150" height="40" rx="7" fill="#fff" stroke="#548abf"/><text x="121" y="972" text-anchor="middle" class="nodeLabel">Draft</text><rect x="225" y="946" width="150" height="40" rx="7" fill="#fff" stroke="#548abf"/><text x="300" y="972" text-anchor="middle" class="nodeLabel">Review</text><rect x="404" y="946" width="150" height="40" rx="7" fill="#fff" stroke="#548abf"/><text x="479" y="972" text-anchor="middle" class="nodeLabel">Refine</text><path d="M199 966 H221" fill="none" stroke="#548abf" stroke-width="2" marker-end="url(#loop-tip-0)"/><path d="M378 966 H400" fill="none" stroke="#548abf" stroke-width="2" marker-end="url(#loop-tip-0)"/><path d="M479 988 V998 Q479 1004 473 1004 H306 Q300 1004 300 998 V989" fill="none" stroke="#548abf" stroke-width="2" marker-end="url(#loop-tip-0)"/><text x="46" y="1029" class="loopDesc">Draft a unified spec; review and refine as needed</text><text x="46" y="1052" class="loopDesc">When ready, proceed to implementation</text></g><g><rect x="28" y="1078" width="544" height="156" rx="9" fill="#eff9f3"/><rect x="28" y="1078" width="4" height="156" rx="2" fill="#55a978"/><text x="46" y="1103" class="loopTitle" fill="#55a978">02 · IMPLEMENTATION LOOP</text><rect x="46" y="1117" width="112" height="40" rx="7" fill="#fff" stroke="#55a978"/><text x="102" y="1143" text-anchor="middle" class="nodeLabel">Build</text><rect x="178" y="1117" width="112" height="40" rx="7" fill="#fff" stroke="#55a978"/><text x="234" y="1143" text-anchor="middle" class="nodeLabel">Test</text><rect x="310" y="1117" width="112" height="40" rx="7" fill="#fff" stroke="#55a978"/><text x="366" y="1143" text-anchor="middle" class="nodeLabel">Review</text><rect x="442" y="1117" width="112" height="40" rx="7" fill="#fff" stroke="#55a978"/><text x="498" y="1143" text-anchor="middle" class="nodeLabel">Fix</text><path d="M161 1137 H174" fill="none" stroke="#55a978" stroke-width="2" marker-end="url(#loop-tip-1)"/><path d="M293 1137 H306" fill="none" stroke="#55a978" stroke-width="2" marker-end="url(#loop-tip-1)"/><path d="M425 1137 H438" fill="none" stroke="#55a978" stroke-width="2" marker-end="url(#loop-tip-1)"/><path d="M498 1159 V1169 Q498 1175 492 1175 H240 Q234 1175 234 1169 V1160" fill="none" stroke="#55a978" stroke-width="2" marker-end="url(#loop-tip-1)"/><text x="46" y="1200" class="loopDesc">Check spec conformance alongside tests and review</text><text x="46" y="1223" class="loopDesc">Spec defect? Return to the Design Spec Loop</text></g><g><rect x="28" y="1249" width="544" height="156" rx="9" fill="#f7f2fa"/><rect x="28" y="1249" width="4" height="156" rx="2" fill="#9673b6"/><text x="46" y="1274" class="loopTitle" fill="#9673b6">03 · EVOLUTION LOOP · ALL STAGES</text><rect x="46" y="1288" width="150" height="40" rx="7" fill="#fff" stroke="#9673b6"/><text x="121" y="1314" text-anchor="middle" class="nodeLabel">New Input</text><rect x="225" y="1288" width="150" height="40" rx="7" fill="#fff" stroke="#9673b6"/><text x="300" y="1314" text-anchor="middle" class="nodeLabel">Reassess</text><rect x="404" y="1288" width="150" height="40" rx="7" fill="#fff" stroke="#9673b6"/><text x="479" y="1314" text-anchor="middle" class="nodeLabel">Adapt</text><path d="M199 1308 H221" fill="none" stroke="#9673b6" stroke-width="2" marker-end="url(#loop-tip-2)"/><path d="M378 1308 H400" fill="none" stroke="#9673b6" stroke-width="2" marker-end="url(#loop-tip-2)"/><path d="M479 1330 V1340 Q479 1346 473 1346 H127 Q121 1346 121 1340 V1331" fill="none" stroke="#9673b6" stroke-width="2" marker-end="url(#loop-tip-2)"/><text x="46" y="1371" class="loopDesc">May act, observe, or decline the input</text><text x="46" y="1394" class="loopDesc">Any stage can trigger or receive changes</text></g></svg>